[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manga-ocr-nar-preview"
version = "0.1.0"
description = "Non-autoregressive OCR for Japanese manga text crops"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.10.0",
  "transformers>=5.0.0",
  "safetensors>=0.5.0",
  "Pillow>=10.0.0",
]

[tool.setuptools.packages.find]
include = ["manga_ocr_nar*"]

